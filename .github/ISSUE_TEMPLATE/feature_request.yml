name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe your idea below.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve? What use case does it enable?
      placeholder: "Currently, the crawler cannot extract structured data from PDF pages linked on contact pages. This would be useful for..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this to work? Any API/CLI changes?
      placeholder: "Add a new extractor `pdf_extractor.py` that downloads linked PDFs and extracts text/tables using pdfplumber..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches you've thought about
      placeholder: "Could also use OCR via Tesseract for image-based PDFs..."

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Links to related issues, docs, examples, or mockups
      placeholder: "Related to #42 - PDF support for programmatic SEO pages"

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the codebase?
      options:
        - crawler (listing/profile/website crawl logic)
        - extractors (new extraction capability)
        - database (schema, persistence, resume)
        - utils (HTTP, normalization, validation, logging)
        - config (new tunables)
        - CLI / main.py
        - Export formats
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues/PRs for similar requests
          required: true
        - label: I'm willing to implement this (or help test)
          required: false
        - label: This aligns with the project's scope (universal, no site-specific code)
          required: true