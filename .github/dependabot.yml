version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      dev-dependencies:
        patterns:
          - "pytest*"
          - "ruff*"
          - "black*"
          - "mypy*"
          - "bandit*"
          - "pre-commit*"
      docs-dependencies:
        patterns:
          - "mkdocs*"
          - "mkdocstrings*"
    ignore:
      - dependency-name: "playwright"
        versions: ["1.40.0", "1.41.0"]  # wait for stealth compatibility

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "github-actions"
      - "automated"